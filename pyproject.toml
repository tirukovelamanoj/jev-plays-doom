[project]
name = "doom-system-one"
version = "0.1.0"
description = "Doom played by a System One model: structured state in, one button out"
requires-python = ">=3.10"
dependencies = ["vizdoom>=1.3.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Jev, via TypeSafe's own SDK. Needs TYPESAFE_API_KEY.
jev = ["typesafe-sdk>=0.6"]
# Recording gameplay to mp4. imageio-ffmpeg bundles its own ffmpeg binary, so
# there is nothing to install system-wide.
record = ["imageio[ffmpeg]>=2.34", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["doom_agent"]
